name: Bug report
description: Something is wrong (false positive, crash, wrong fix)
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Searvex version, placeholder: "searvex --version" }
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes: { label: Mode, options: [website, repository, optimize, plugin, other] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect?, description: "Include the rule id for wrong findings." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproduction, description: "Command, minimal HTML/repo snippet or public URL. Do not paste secrets." }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "OS, Node version" }
